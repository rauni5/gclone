name: Bug report
description: Something did not work the way it should
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A reproducible report is the fastest way to a fix.
        **Remove secrets** (keys, passwords, connection strings) from anything you paste.
  - type: input
    id: version
    attributes:
      label: gclone version
      description: Output of `gclone --version`
      placeholder: gclone 0.1.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install gclone?
      options:
        - go install
        - Release binary
        - Built from source
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
      placeholder: gclone someone/app
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository you were setting up
      description: A link if it is public. This makes the bug much easier to reproduce.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node --version`, `npm --version` and `docker info` if relevant.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues
          required: true
        - label: I removed secrets from everything I pasted
          required: true
