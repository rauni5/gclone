name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Test with the race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: Smoke test
        run: go run . --version
